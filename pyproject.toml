[project]
name = "langchain-reader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "a-sidarau", email = "anthony.sidarau@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langsmith>=0.14.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
langchain-reader = "langchain_reader:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
